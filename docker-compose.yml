services:
  postgres:
    image: postgres:16-alpine
    container_name: demo-sql-certification-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sqluser
      POSTGRES_PASSWORD: sqlpass
      POSTGRES_DB: sql_certification
    volumes:
      - postgresData:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqluser -d sql_certification"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: demo-sql-certification-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/demo-shop-realm.json:/opt/keycloak/data/import/demo-shop-realm.json:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: demo-sql-certification-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sql_certification
      POSTGRES_USER: sqluser
      POSTGRES_PASSWORD: sqlpass
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_AUTH_LOGIN_SUCCESS_URL: http://localhost:5173/
      APP_AUTH_LOGOUT_SUCCESS_URL: http://localhost:5173/login
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:8180/realms/demo-shop
      KEYCLOAK_CLIENT_ID: demoshop-api
      KEYCLOAK_CLIENT_SECRET: demoshop-secret
      APP_SECURITY_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: demo-sql-certification-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
      - keycloak

volumes:
  postgresData:
