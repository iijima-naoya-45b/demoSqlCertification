services:
  postgres:
    image: postgres:16-alpine
    container_name: demo-sql-certification-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sqluser
      POSTGRES_PASSWORD: sqlpass
      POSTGRES_DB: sql_certification
    volumes:
      - postgresData:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqluser -d sql_certification"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: demo-sql-certification-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/demo-shop-realm.json:/opt/keycloak/data/import/demo-shop-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  keycloak-config:
    image: curlimages/curl:8.12.1
    container_name: demo-sql-certification-keycloak-config
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_REALM: demo-shop
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./scripts/configureKeycloakGoogleIdp.sh:/configure.sh:ro
    entrypoint: ["/bin/sh", "/configure.sh"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: demo-sql-certification-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sql_certification
      POSTGRES_USER: sqluser
      POSTGRES_PASSWORD: sqlpass
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_AUTH_LOGIN_SUCCESS_URL: http://localhost:5173/
      APP_AUTH_LOGOUT_SUCCESS_URL: http://localhost:5173/login
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:8180/realms/demo-shop
      KEYCLOAK_CLIENT_ID: demoshop-api
      KEYCLOAK_CLIENT_SECRET: demoshop-secret
      APP_SECURITY_ENABLED: "true"
      APP_AUTH_GOOGLE_LOGIN_ENABLED: ${APP_AUTH_GOOGLE_LOGIN_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: demo-sql-certification-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
      - keycloak

volumes:
  postgresData:
