spring:
  application:
    name: demo-sql-certification-api

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: DEMO_SHOP_SESSION
        http-only: true
        secure: false
        same-site: lax

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
  auth:
    login-url: /oauth2/authorization/keycloak
    google-login-enabled: ${APP_AUTH_GOOGLE_LOGIN_ENABLED:false}
    google-login-url: /oauth2/authorization/keycloak?idp=google
    login-success-url: ${APP_AUTH_LOGIN_SUCCESS_URL:http://localhost:5173/}
    logout-success-url: ${APP_AUTH_LOGOUT_SUCCESS_URL:http://localhost:5173/login}
  sandbox:
    max-rows: 500
    query-timeout-seconds: 15

spring.security.oauth2.client:
  registration:
    keycloak:
      client-id: ${KEYCLOAK_CLIENT_ID:demoshop-api}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:demoshop-secret}
      scope: openid,profile,email
      authorization-grant-type: authorization_code
      redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  provider:
    keycloak:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/demo-shop}

spring.datasource:
  url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sql_certification}
  username: ${POSTGRES_USER:sqluser}
  password: ${POSTGRES_PASSWORD:sqlpass}
  driver-class-name: org.postgresql.Driver

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.sqlcertification.demo.model
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

logging:
  level:
    com.sqlcertification.demo.mapper: DEBUG
    org.springframework.security: INFO
